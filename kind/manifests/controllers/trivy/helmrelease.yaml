---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: trivy
  namespace: trivy-system
spec:
  interval: 10m
  chart:
    spec:
      chart: trivy-operator
      version: "0.32.0"
      sourceRef:
        kind: HelmRepository
        name: trivy
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
