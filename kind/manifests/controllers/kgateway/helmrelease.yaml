---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: kgateway-crds
  namespace: kgateway-system
spec:
  interval: 10m
  chart:
    spec:
      chart: kgateway-crds
      version: "2.3.0-main"
      sourceRef:
        kind: HelmRepository
        name: kgateway
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: kgateway
  namespace: kgateway-system
spec:
  interval: 10m
  chart:
    spec:
      chart: kgateway
      version: "2.3.0-main"
      sourceRef:
        kind: HelmRepository
        name: kgateway
        namespace: flux-system
      interval: 10m
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    controller:
      replicaCount: 1
    extraEnv:
      KGW_ENABLE_GATEWAY_API_EXPERIMENTAL_FEATURES: "true"
