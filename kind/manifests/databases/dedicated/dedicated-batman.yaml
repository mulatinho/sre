# Versão com REQUIRED anti-affinity (mais rigorosa)
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: batman-cluster
  namespace: database
spec:
  bootstrap:
    initdb:
      database: dedicated
      owner: dedicated_admin
      secret:
        name: batman-cluster-secret
      postInitSQL:
        - |
          CREATE TABLE IF NOT EXISTS users (
              id SERIAL PRIMARY KEY,
              username VARCHAR(100) UNIQUE NOT NULL,
              email VARCHAR(255) UNIQUE NOT NULL,
              created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
          );
        - |
          CREATE TABLE IF NOT EXISTS stock_positions (
              id SERIAL PRIMARY KEY,
              user_id INTEGER REFERENCES users(id),
              symbol VARCHAR(10) NOT NULL,
              shared_quantity INTEGER NOT NULL,
              average_price DECIMAL(10,2) NOT NULL,
              created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
              updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
          );
        - |
          INSERT INTO users (username, email) VALUES 
              ('alice_invest', 'alice@example.com'),
              ('bob_trader', 'bob@example.com'),
              ('carol_holder', 'carol@example.com')
          ON CONFLICT (username) DO NOTHING;
        - |
          INSERT INTO stock_positions (user_id, symbol, shared_quantity, average_price) VALUES
            (1, 'AAPL', 150, 175.50),
            (1, 'GOOGL', 75, 140.25),
            (1, 'MSFT', 200, 330.80),
            (1, 'AMZN', 50, 185.60),
            (2, 'TSLA', 100, 250.00),
            (2, 'NVDA', 50, 120.75),
            (2, 'META', 300, 350.20),
            (2, 'NFLX', 80, 480.90),
            (3, 'VTI', 500, 250.00),
            (3, 'BND', 200, 75.30),
            (3, 'VXUS', 150, 60.40),
            (3, 'SPY', 100, 520.00);

  instances: 2

  affinity:
    nodeSelector:
      node-role.kubernetes.io/database: "true"

    tolerations:
      - key: "dedicated"
        operator: "Equal"
        value: "database"
        effect: "NoSchedule"

  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          cnpg.io/cluster: batman-cluster

  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"

  storage:
    size: 1Gi
    storageClass: "standard" # maybe "local-path"

  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: "256MB"
      effective_cache_size: "768MB"

  monitoring:
    enablePodMonitor: true
